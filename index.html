<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#17152e">
<title>いぼ次元ラッシュ v0.50 · COLOR TRAIL</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;background:#141225;color:#faf5ff;font-family:system-ui,"Yu Gothic",sans-serif;min-height:100%;overscroll-behavior:none}
  body{display:grid;place-items:center;min-height:100dvh;background:radial-gradient(ellipse at top,#35305c,#141225 70%)}
  #wrap{width:min(1100px,100%);padding:20px} .mast{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.brand{font-weight:900;letter-spacing:.08em}.brand small{display:block;color:#b7abd1;font-size:10px;letter-spacing:.26em;margin-top:4px}
  .tools{display:flex;gap:8px}button{font:inherit;color:inherit;border:1px solid #ffffff30;background:#ffffff10;border-radius:12px;padding:9px 14px;cursor:pointer;touch-action:none}button:focus-visible{outline:3px solid #9cf1d0}button:hover{background:#ffffff22}
  #screen{position:relative;isolation:isolate}canvas{display:block;width:100%;height:auto;border-radius:18px;box-shadow:0 20px 70px #0007;touch-action:none}
  #hud{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#b7abd1;padding:12px 4px}
  #mobile{display:none;position:absolute;inset:0;pointer-events:none;align-items:flex-end;justify-content:space-between;padding:18px 22px;z-index:2}.pad{display:flex;gap:12px}#mobile button{pointer-events:auto;width:62px;height:62px;padding:0;background:#20172b70;border:2px solid #ffffff70;border-radius:50%;font-size:24px;font-weight:800;user-select:none;-webkit-user-select:none}#mobile button.pressed{background:#aa79edb0;transform:scale(.94)}#mobile #jump{width:76px;height:76px;background:#7348b699}#mobile #shot{font-size:16px;align-self:flex-end}
  #overlay{position:absolute;inset:0;z-index:3;display:grid;place-items:center;border-radius:18px;background:#18132980;backdrop-filter:blur(6px)}#overlay[hidden]{display:none}.card{text-align:center;max-width:520px;padding:25px}.eyebrow{color:#b5f5cf;font-size:11px;letter-spacing:.25em}.card h1{font-size:clamp(25px,5vw,48px);margin:12px 0}.card p{color:#f0e9fa;line-height:1.7;font-size:14px}.primary{background:#b5f5cf;color:#222033;border:0;font-weight:800;padding:13px 28px}.primary:hover{background:#d2ffe3}.secondary{margin-left:8px}#rotate{display:none}
  @media(pointer:coarse){#mobile{display:flex}#hud .help{display:none}}
  @media(max-height:600px) and (orientation:landscape){#wrap{width:min(100vw,calc((100dvh - 42px)*16/9));padding:0}.mast{height:36px;margin:0;padding:0 8px}.brand{font-size:12px}.brand small,#hud{display:none}.tools button{padding:4px 10px;font-size:12px}canvas,#overlay{border-radius:0}#mobile{padding:10px 18px}.card{padding:10px}.card h1{margin:7px 0}.card p{margin:8px 0}}
  @media(orientation:portrait) and (pointer:coarse){#rotate{display:grid;position:fixed;inset:0;z-index:10;place-content:center;text-align:center;background:#17152ef5;padding:30px;font-size:20px}}
  #wrap:fullscreen{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#141225;width:100vw;height:100dvh;padding:0}#wrap:fullscreen #screen,#wrap:fullscreen .mast{width:min(100vw,calc((100dvh - 42px)*16/9))}#wrap:fullscreen .mast{height:36px;margin:0;padding:0 8px;flex-shrink:0}#wrap:fullscreen .brand small,#wrap:fullscreen #hud{display:none}#wrap:fullscreen .tools button{padding:4px 10px;font-size:12px}
</style>
</head>
<body>
<div id="wrap">
  <header class="mast"><div class="brand">いぼ次元ラッシュ<small>COLOR TRAIL / 3 STAGES</small></div><div class="tools"><button id="sound" aria-label="音のオンオフ" aria-pressed="false">音 OFF</button><button id="pause">一時停止</button><button id="fullscreen">全画面</button></div></header>
  <div id="screen">
    <canvas id="game" width="960" height="540" aria-label="いぼ次元ラッシュ ゲーム画面"></canvas>
    <div id="mobile"><div class="pad"><button id="left" aria-label="左へ">‹</button><button id="right" aria-label="右へ">›</button></div><div class="pad"><button id="shot" aria-label="ミサイル">SHOT</button><button id="jump" aria-label="ジャンプ">↑</button></div></div>
    <div id="overlay"><div class="card"><div class="eyebrow" id="eyebrow">A LITTLE HERO. A COLORFUL JOURNEY.</div><h1 id="heading">いぼ次元ラッシュ</h1><p id="message">走って、跳んで、いぼミサイル！<br>3つの景色をめぐる、小さな冒険。</p><button class="primary" id="action">あそぶ</button><button class="secondary" id="retry" hidden>もう一度</button></div></div>
  </div>
  <div id="hud"><span class="help">← → / A D 移動　Space / W ジャンプ　I / J ミサイル　Esc 一時停止　R リトライ</span><span id="status">v0.50 · COLOR TRAIL</span></div>
</div><div id="rotate">↻<br>横向きにして遊んでね</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = "high";

const W = canvas.width, H = canvas.height;
const GRAVITY = 0.75;
let WORLD_W = 5200;
const SHOT_RANGE = W * 2 / 5;
/*
 * SPRITE ATLAS SPECIFICATION
 * File: ibojigen_sprite_atlas_1280x456.png (actual size: 1280 x 456 px)
 * Grid: 8 columns x 2 rows; cell size = pitch = 160 x 228 px; gutter = 0 px.
 * Origin: top-left. Tiles are stored bottom-centre in each cell.
 * Rows: 0 = player (native facing right), 1 = enemy (native facing left).
 * Columns/animation: 0 idle A, 1 idle B, 2-5 run A-D, 6 jump/up, 7 fall/down.
 * `x/y/w/h` below are the tight opaque-art bounds used by drawImage, so changing
 * cell alignment or artwork requires updating these bounds as well.
 * Rebuild command: powershell -File tools/repack_sprite_atlas.ps1
 */
const SPRITE_ATLAS = Object.freeze({width:1280,height:456,columns:8,rows:2,cellWidth:160,cellHeight:228,pitchX:160,pitchY:228,gutter:0});
const SPRITE_TILES = [
  [
    {name:"player_idle_a",x:6,y:19,w:148,h:209},
    {name:"player_idle_b",x:167,y:19,w:145,h:209},
    {name:"player_run_a", x:326,y:18,w:147,h:210},
    {name:"player_run_b", x:487,y:16,w:146,h:212},
    {name:"player_run_c", x:646,y:20,w:148,h:208},
    {name:"player_run_d", x:806,y:18,w:148,h:210},
    {name:"player_jump",  x:960,y:16,w:160,h:212},
    {name:"player_fall",   x:1123,y:43,w:153,h:185}
  ],
  [
    {name:"enemy_idle_a",x:7,y:241,w:145,h:215},
    {name:"enemy_idle_b",x:168,y:241,w:144,h:215},
    {name:"enemy_run_a", x:328,y:234,w:144,h:222},
    {name:"enemy_run_b", x:483,y:228,w:153,h:228},
    {name:"enemy_run_c", x:646,y:234,w:148,h:222},
    {name:"enemy_run_d", x:806,y:234,w:148,h:222},
    {name:"enemy_jump",  x:965,y:240,w:150,h:216},
    {name:"enemy_fall",   x:1126,y:262,w:148,h:194}
  ]
];
let mode="title", stageIndex=0, muted=true, musicTimer=0, musicStep=0;
const FLOOR_Y = 455;

const atlas = new Image();
let atlasReady = false;
atlas.onload = () => { atlasReady = true; };
atlas.onerror = () => { document.getElementById("status").textContent="キャラ画像を読み込めません。再読み込みしてください。"; };
atlas.src = "ibojigen_sprite_atlas_1280x456.png";

const keys = Object.create(null);
addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if (["arrowleft","arrowright"," ","w","a","d","i","j","r"].includes(e.key.toLowerCase())) e.preventDefault();
  if (e.key.toLowerCase() === "r" && mode!=="title") { resetLevel(); setMode("playing"); }
  if(e.key==="Escape" && !e.repeat) togglePause();
  if(e.key==="Enter" && !e.repeat && mode!=="playing") document.getElementById("action").click();
});
addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
addEventListener("blur", () => { clearKeys(); if(mode==="playing") setMode("paused"); });
document.addEventListener("visibilitychange",()=>{if(document.hidden && mode==="playing"){clearKeys();setMode("paused");}});

function clearKeys(){for(const k in keys) keys[k]=false;document.querySelectorAll(".pressed").forEach(e=>e.classList.remove("pressed"));}
function bindHold(id,key){
 const el=document.getElementById(id);let pointer=null;
 el.addEventListener("pointerdown",e=>{e.preventDefault();if(pointer!==null)return;pointer=e.pointerId;el.setPointerCapture(pointer);keys[key]=true;el.classList.add("pressed");});
 const up=e=>{if(e.pointerId!==pointer)return;keys[key]=false;pointer=null;el.classList.remove("pressed");};
 el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);el.addEventListener("lostpointercapture",up);
}
bindHold("left","arrowleft"); bindHold("right","arrowright");
bindHold("jump"," "); bindHold("shot","i");

// ---- tiny synth SE ----
let ac=null, master=null;
function audio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = .23;
    master.connect(ac.destination);
  }
  if (ac.state==="suspended") ac.resume();
  return ac;
}
["pointerdown","keydown","touchstart"].forEach(ev=>addEventListener(ev, audio, {once:true, capture:true}));
function tone(f1,f2,d=.08,type="square",v=.16) {
  if(muted) return;
  const a=audio(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain(), t=a.currentTime;
  o.type=type; o.frequency.setValueAtTime(f1,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+d);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(v,t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.02);
}
const sfx = {
  jump:()=>tone(280,620,.12,"square",.16),
  shot:()=>tone(800,250,.09,"square",.13),
  hit:()=>tone(180,80,.12,"sawtooth",.14),
  coin:()=>{tone(700,980,.06,"square",.10); setTimeout(()=>tone(980,1320,.06,"square",.08),55);},
  clear:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,f,.12,"square",.12),i*90))
};

// ---- helpers ----
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const intersect=(a,b)=>a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;

const baseLevel = {
  platforms: [
    {x:0,y:FLOOR_Y,w:860,h:85},
    {x:980,y:FLOOR_Y,w:760,h:85},
    {x:1840,y:FLOOR_Y,w:1020,h:85},
    {x:2980,y:FLOOR_Y,w:760,h:85},
    {x:3840,y:FLOOR_Y,w:1360,h:85},
    {x:620,y:360,w:180,h:22},
    {x:1180,y:335,w:190,h:22},
    {x:1500,y:285,w:190,h:22},
    {x:2150,y:360,w:180,h:22},
    {x:2460,y:310,w:180,h:22},
    {x:3220,y:345,w:220,h:22},
    {x:3560,y:300,w:180,h:22},
    {x:4170,y:350,w:180,h:22},
    {x:4510,y:300,w:200,h:22},
  ],
  coins: [
    [660,320],[720,320],[1220,295],[1280,295],[1540,245],[1600,245],
    [2200,320],[2510,270],[3270,305],[3340,305],[3600,260],[4210,310],
    [4560,260],[4630,260]
  ].map(([x,y])=>({x,y,r:10,taken:false})),
  enemySpawns: [
    {x:1260,y:FLOOR_Y},{x:2040,y:FLOOR_Y},{x:2680,y:FLOOR_Y},
    {x:3300,y:FLOOR_Y},{x:4120,y:FLOOR_Y},{x:4700,y:FLOOR_Y}
  ],
  goalX: 5050
};

const themes=[
 {name:"はじまりの草原",sky:["#84d6f4","#fce3b5","#efd1a3"],mountains:["#bbc5dc","#8aa7bb"],grass:"#8bce86",dirt:"#ba8560",accent:"#8b49ff",notes:[261.63,329.63,392,523.25,440,392,329.63,293.66]},
 {name:"夕焼けの遺跡",sky:["#aa95db","#ffc6aa","#efad87"],mountains:["#ba91bc","#88799d"],grass:"#e5b578",dirt:"#9b7180",accent:"#e88d70",notes:[293.66,349.23,440,587.33,523.25,440,349.23,329.63]},
 {name:"星あかりの森",sky:["#24294f","#52678f","#8a99af"],mountains:["#556582","#3e536d"],grass:"#79c6b3",dirt:"#69758b",accent:"#83e3d7",notes:[261.63,311.13,392,523.25,466.16,392,311.13,349.23]}
];
function buildLevel(index){
 const offsets=[0,65,-45];
 const platforms=baseLevel.platforms.map((p,i)=>({...p,...(i>=5?{x:p.x+offsets[index],y:p.y-(index===2?20:0)}:{})}));
 const coins=baseLevel.coins.map(c=>({...c,x:c.x+offsets[index],y:c.y-(index===2?20:0)}));
 const enemySpawns=baseLevel.enemySpawns.map((e,i)=>({...e,type:index===0?"walker":i%3===1?"flyer":i%3===2?"hopper":"walker"}));
 if(index>0)enemySpawns.push({x:1550,y:320,type:"flyer"},{x:4350,y:FLOOR_Y,type:"hopper"});
 return {platforms,coins,enemySpawns,goalX:baseLevel.goalX};
}
let level=buildLevel(0);
function setMode(next){
 mode=next;clearKeys();const overlay=document.getElementById("overlay");overlay.hidden=next==="playing";
 document.getElementById("pause").textContent=next==="paused"?"再開":"一時停止";
 const title=document.getElementById("heading"),message=document.getElementById("message"),action=document.getElementById("action");
 document.getElementById("retry").hidden=next!=="clear";
 if(next==="paused"){title.textContent="ちょっと休憩";message.textContent="準備ができたら、冒険の続きを。";action.textContent="つづける";}
 if(next==="dead"){title.textContent="もう一度、いこう！";message.textContent="コツは近づいて撃つこと。踏みつけも使えるよ。";action.textContent="リトライ";}
 if(next==="clear"){title.textContent=stageIndex===2?"冒険、コンプリート！":"STAGE CLEAR!";message.textContent=`${themes[stageIndex].name} · いぼ ${player.score} / ${level.coins.length}`;action.textContent=stageIndex===2?"最初から遊ぶ":"次のステージへ";}
}
function togglePause(){if(mode==="playing")setMode("paused");else if(mode==="paused")setMode("playing");}
document.getElementById("pause").onclick=togglePause;
document.getElementById("action").onclick=()=>{audio();if(mode==="clear")stageIndex=(stageIndex+1)%3;if(mode!=="paused")resetLevel();setMode("playing");};
document.getElementById("retry").onclick=()=>{resetLevel();setMode("playing");};
document.getElementById("sound").onclick=()=>{muted=!muted;audio();master?.gain.setValueAtTime(muted?0:.23,ac.currentTime);document.getElementById("sound").textContent=muted?"音 OFF":"音 ON";document.getElementById("sound").setAttribute("aria-pressed",String(!muted));};
document.getElementById("fullscreen").onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.getElementById("wrap").requestFullscreen();}catch{document.getElementById("status").textContent="このブラウザでは全画面表示に対応していません";}};
document.addEventListener("fullscreenchange",()=>{document.getElementById("fullscreen").textContent=document.fullscreenElement?"全画面終了":"全画面";});
function updateMusic(dt){if(muted)return;musicTimer-=dt;if(musicTimer<=0){musicTimer=220;const notes=themes[stageIndex].notes;const f=notes[musicStep%notes.length];tone(f,f,.25,"sine",.035);if(musicStep%4===0)tone(notes[0]/2,notes[0]/2,.7,"triangle",.04);musicStep++;}}

const player = {
  x:120,y:380,w:42,h:78,vx:0,vy:0,
  speed:4.8,jump:-14.5,onGround:false,facing:1,
  hp:3, inv:0, shotCd:0, score:0, dead:false, clear:false
};

let enemies=[], shots=[], particles=[], cameraX=0, last=0, clearPlayed=false;

function makeEnemy(s) {
  return {
    type:s.type||"walker", phase:s.x*.01, hopTimer:900+s.x%500,
    x:s.x,y:s.type==="flyer"?s.y-105:s.y,w:42,h:72,vx:-1.0,vy:0,onGround:false,
    facing:-1, alive:true, hp:1, minX:s.x-120,maxX:s.x+120
  };
}
function resetLevel() {
  level=buildLevel(stageIndex);musicTimer=0;musicStep=0;
  Object.assign(player,{x:120,y:380,vx:0,vy:0,onGround:false,facing:1,hp:3,inv:0,shotCd:0,score:0,dead:false,clear:false,_jumpLatch:false,_shotLatch:false,coyote:0,jumpBuffer:0,safeX:120,safeY:FLOOR_Y,recoil:0});
  enemies=level.enemySpawns.map(makeEnemy);
  shots=[]; particles=[]; cameraX=0; clearPlayed=false;
  level.coins.forEach(c=>c.taken=false);
}
resetLevel();

function standingRect(o){return {x:o.x-o.w/2,y:o.y-o.h,w:o.w,h:o.h};}

function moveAndCollide(o, dtScale, platforms) {
  // horizontal
  o.x += o.vx*dtScale;
  let r=standingRect(o);
  for (const p of platforms) if (p.y>=FLOOR_Y && intersect(r,p)) {
    if (o.vx>0) o.x=p.x-o.w/2;
    else if (o.vx<0) o.x=p.x+p.w+o.w/2;
    r=standingRect(o);
  }

  // vertical
  o.vy += GRAVITY*dtScale;
  o.y += o.vy*dtScale;
  o.onGround=false;
  r=standingRect(o);
  for (const p of platforms) if (intersect(r,p)) {
    if (o.vy>0 && (r.y+r.h-o.vy*dtScale)<=p.y+8) {
      o.y=p.y; o.vy=0; o.onGround=true;
    } else if (o.vy<0 && p.y>=FLOOR_Y) {
      o.y=p.y+p.h+o.h; o.vy=0;
    }
    r=standingRect(o);
  }
}

function spawnBurst(x,y,color,count=8){
  for(let i=0;i<count;i++) particles.push({
    x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.8)*5,life:450+Math.random()*250,color
  });
}

function update(dt) {
  const f=Math.min(2.2,dt/16.6667);
  if (mode!=="playing") {
    return;
  }

  updateMusic(dt);
  player.recoil=Math.max(0,player.recoil-dt);
  player.coyote=player.onGround?100:Math.max(0,player.coyote-dt);
  const jumpHeld=keys[" "]||keys["w"];
  if(jumpHeld&&!player._jumpLatch)player.jumpBuffer=120;
  else player.jumpBuffer=Math.max(0,player.jumpBuffer-dt);
  player._jumpLatch=!!jumpHeld;
  player.inv=Math.max(0,player.inv-dt);
  player.shotCd=Math.max(0,player.shotCd-dt);

  const left=keys["arrowleft"]||keys["a"], right=keys["arrowright"]||keys["d"];
  player.vx = left&&!right ? -player.speed : right&&!left ? player.speed : player.vx*.72;
  if (Math.abs(player.vx)<.08) player.vx=0;
  if (player.vx!==0) player.facing=Math.sign(player.vx);

  if(player.jumpBuffer>0 && player.coyote>0){player.vy=player.jump;player.onGround=false;player.coyote=0;player.jumpBuffer=0;sfx.jump();spawnBurst(player.x,player.y,"#ffffff",5);}

  if ((keys["i"]||keys["j"]) && player.shotCd<=0 && !player._shotLatch) {
    player.shotCd=280; player._shotLatch=true;player.recoil=130;
    shots.push({x:player.x+player.facing*34,y:player.y-42,vx:player.facing*8.5,r:7,alive:true,distance:0});
    sfx.shot();
  }
  if (!(keys["i"]||keys["j"])) player._shotLatch=false;

  moveAndCollide(player,f,level.platforms);
  player.x=clamp(player.x,30,WORLD_W-30);

  if(player.onGround && level.platforms.some(p=>player.y===p.y&&player.x>p.x+35&&player.x<p.x+p.w-35)){player.safeX=player.x;player.safeY=player.y;}
  // fall
  if (player.y>H+100) hurtPlayer(true);
  if(player.dead)return;

  // coins
  for(const c of level.coins){
    if(c.taken) continue;
    const dx=player.x-c.x, dy=(player.y-player.h/2)-c.y;
    if(dx*dx+dy*dy<28*28){ c.taken=true; player.score++; sfx.coin(); spawnBurst(c.x,c.y,"#ffd84d",6); }
  }

  // enemies
  for(const e of enemies){
    if(!e.alive) continue;
    if(e.onGround){
      if(e.x<e.minX) e.vx=Math.abs(e.vx);
      if(e.x>e.maxX) e.vx=-Math.abs(e.vx);
    }
    e.facing=Math.sign(e.vx)||-1;
    e.phase+=dt*.003;
    if(e.type==="flyer"){
      e.x+=e.vx*f;if(e.x<e.minX||e.x>e.maxX)e.vx*=-1;
      e.y=FLOOR_Y-95+Math.sin(e.phase)*28;e.onGround=false;e.vy=0;
    }else{
      if(e.type==="hopper"){e.hopTimer-=dt;if(e.onGround&&e.hopTimer<=0){e.vy=-10;e.hopTimer=1400;}}
      if(e.onGround&&!level.platforms.some(p=>Math.abs(p.y-e.y)<3&&e.x+Math.sign(e.vx)*28>=p.x&&e.x+Math.sign(e.vx)*28<=p.x+p.w))e.vx*=-1;
      moveAndCollide(e,f,level.platforms);
    }
    const pr=standingRect(player), er=standingRect(e);
    if(intersect(pr,er) && player.inv<=0){
      const playerBottom=pr.y+pr.h;
      if(player.vy>2 && playerBottom-er.y<30){
        e.alive=false; player.vy=-9; spawnBurst(e.x,e.y-35,"#f5d3a5",10); sfx.hit();
      } else hurtPlayer(false);
    }
  }

  // shots
  for(const s of shots){
    if(!s.alive) continue;
    const travel=Math.min(Math.abs(s.vx*f),SHOT_RANGE-s.distance);
    s.x+=Math.sign(s.vx)*travel;s.distance+=travel;
    if(level.platforms.some(p=>intersect({x:s.x-s.r,y:s.y-s.r,w:s.r*2,h:s.r*2},p))){s.alive=false;spawnBurst(s.x,s.y,"#cdb3ff",4);continue;}
    const sr={x:s.x-s.r,y:s.y-s.r,w:s.r*2,h:s.r*2};
    for(const e of enemies){
      if(!e.alive) continue;
      if(intersect(sr,standingRect(e))){
        e.alive=false; s.alive=false; spawnBurst(e.x,e.y-35,"#8e55ff",12); sfx.hit(); break;
      }
    }
  }
    for(const s of shots)if(s.alive&&s.distance>=SHOT_RANGE){s.alive=false;spawnBurst(s.x,s.y,"#cdb3ff",4);}
  shots=shots.filter(s=>s.alive);

  if (player.x>level.goalX) {
    player.clear=true;setMode("clear");
    if(!clearPlayed){clearPlayed=true; sfx.clear();}
  }

  // camera follow
  const target=clamp(player.x-W*0.36,0,WORLD_W-W);
  cameraX += (target-cameraX)*Math.min(1,.08*f);

  updateParticles(f,dt);
}

function hurtPlayer(fall){
  if(player.dead || (!fall&&player.inv>0))return;
  player.hp--;sfx.hit();spawnBurst(player.x,player.y-40,"#ff89a4",14);
  if(player.hp<=0){player.dead=true;setMode("dead");return;}
  player.inv=1200;
  if(fall){player.x=player.safeX;player.y=player.safeY;player.vx=0;player.vy=0;}
  else {player.x=clamp(player.x-player.facing*18,30,WORLD_W-30);player.vy=-6;}
}
function updateParticles(f,dt){
  for(const p of particles){ p.x+=p.vx*f; p.y+=p.vy*f; p.vy+=.18*f; p.life-=dt; }
  particles=particles.filter(p=>p.life>0);
}

// ---- draw ----
function spriteFrame(o,isEnemy){
  if(!o.onGround) return o.vy<0?6:7;
  const moving=Math.abs(o.vx)>.25;
  return moving?2+(Math.floor(performance.now()/115)%4):Math.floor(performance.now()/520)%2;
}
function drawSprite(o,isEnemy=false){
  const frame=SPRITE_TILES[isEnemy?1:0][spriteFrame(o,isEnemy)];
  const nativeFacing=isEnemy?-1:1;
  const flip=o.facing!==nativeFacing;
  const scale=(isEnemy?86:96)/SPRITE_TILES[isEnemy?1:0][0].h;
  const drawH=frame.h*scale, drawW=frame.w*scale;
  ctx.save();
  ctx.translate(o.x-cameraX,o.y);
  ctx.fillStyle="#24213925";ctx.beginPath();ctx.ellipse(0,1,24,5,0,0,Math.PI*2);ctx.fill();
  if(isEnemy && o.type==="flyer"){ctx.fillStyle="#d9eaffbb";for(const side of [-1,1]){ctx.beginPath();ctx.ellipse(side*32,-43,20,8,side*Math.sin(o.phase*4)*.5,0,Math.PI*2);ctx.fill();}}
  if(isEnemy && o.type==="hopper"){ctx.fillStyle="#ffcc72";ctx.beginPath();ctx.moveTo(-12,-87);ctx.lineTo(0,-103);ctx.lineTo(12,-87);ctx.fill();}
  if(o===player && player.recoil>0)ctx.rotate(-player.facing*.08*player.recoil/130);
  if(player.inv>0 && o===player && Math.floor(performance.now()/70)%2===0) ctx.globalAlpha=.35;
  if(flip) ctx.scale(-1,1);
  if(atlasReady) ctx.drawImage(atlas,frame.x,frame.y,frame.w,frame.h,-drawW/2,-drawH,drawW,drawH);
  else {ctx.fillStyle=isEnemy?"#f5d3a5":"#b673ff"; ctx.fillRect(-20,-70,40,70);}
  ctx.restore();
}

function drawBackground(){
  const theme=themes[stageIndex];
  // sky
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,theme.sky[0]); g.addColorStop(.65,theme.sky[1]); g.addColorStop(1,theme.sky[2]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // sun
  ctx.fillStyle="rgba(255,247,205,.85)";
  ctx.beginPath(); ctx.arc(790-cameraX*.03,90,46,0,Math.PI*2); ctx.fill();

  // far mountains
  drawMountainLayer(theme.mountains[0], .12, 330, 110, 320);
  drawMountainLayer(theme.mountains[1], .22, 380, 145, 260);

  if(stageIndex===2){ctx.fillStyle="#ffffffaa";for(let i=0;i<45;i++){const x=((i*137-cameraX*.05)%W+W)%W;const y=22+(i*73)%200;ctx.fillRect(x,y,2,2);}}
  // clouds
  for(let i=0;i<8;i++){
    const x=(i*420 - cameraX*.16)%(W+500)-100;
    const y=75+(i%3)*48;
    ctx.fillStyle="rgba(255,255,255,.65)";
    ctx.beginPath();
    ctx.arc(x,y,28,0,Math.PI*2); ctx.arc(x+28,y-8,22,0,Math.PI*2); ctx.arc(x+56,y,28,0,Math.PI*2); ctx.fill();
  }

  // near ruins/trees
  for(let i=0;i<20;i++){
    const wx=250+i*300;
    const x=wx-cameraX*.55;
    if(x<-100||x>W+100) continue;
    ctx.fillStyle=i%2?"#7a6a73":"#6a5b64";
    ctx.fillRect(x,310,16,95);
    ctx.fillRect(x-18,308,52,12);
    ctx.fillStyle="#6fa85c";
    ctx.beginPath(); ctx.arc(x+8,285,34,0,Math.PI*2); ctx.fill();
  }
}
function drawMountainLayer(color, factor, baseY, amp, step){
  ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(0,H);
  let x0=-(cameraX*factor)%step-step;
  ctx.lineTo(x0,baseY);
  for(let x=x0;x<W+step;x+=step){
    ctx.lineTo(x+step*.5,baseY-amp);
    ctx.lineTo(x+step,baseY);
  }
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
}

function drawPlatforms(){
  for(const p of level.platforms){
    const x=p.x-cameraX; if(x+p.w<0||x>W) continue;
    ctx.fillStyle=themes[stageIndex].dirt;
    ctx.fillRect(x,p.y,p.w,p.h);
    ctx.fillStyle=themes[stageIndex].grass; ctx.fillRect(x,p.y,p.w,10);
    ctx.fillStyle="#ffffff35";ctx.fillRect(x,p.y,p.w,3);
    ctx.fillStyle="rgba(255,255,255,.16)";
    for(let xx=x+18;xx<x+p.w;xx+=42) ctx.fillRect(xx,p.y+22,14,5);
  }
}
function drawCoins(){
  for(const c of level.coins){
    if(c.taken) continue;
    const x=c.x-cameraX; if(x<-30||x>W+30) continue;
    const pulse=1+Math.sin(performance.now()/140+c.x)*.12;
    ctx.fillStyle="#ffd84d"; ctx.strokeStyle="#a56e00"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(x,c.y,8*pulse,12,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }
}
function drawGoal(){
  const x=level.goalX-cameraX;
  if(x<-100||x>W+100) return;
  ctx.fillStyle="#5b4a45"; ctx.fillRect(x,250,8,205);
  ctx.fillStyle="#ff6f91";
  ctx.beginPath(); ctx.moveTo(x+8,260); ctx.lineTo(x+75,285); ctx.lineTo(x+8,310); ctx.closePath(); ctx.fill();
}
function drawShots(){
  for(const s of shots){
    const x=s.x-cameraX;
    const trail=ctx.createLinearGradient(x-Math.sign(s.vx)*30,s.y,x,s.y);trail.addColorStop(0,"#b28aff00");trail.addColorStop(1,"#b28affbb");ctx.fillStyle=trail;ctx.beginPath();ctx.ellipse(x-Math.sign(s.vx)*12,s.y,24,5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#f2dcff";ctx.shadowColor="#a374ff";ctx.shadowBlur=14; ctx.strokeStyle="#8b49ff"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(x,s.y,s.r,0,Math.PI*2); ctx.fill(); ctx.stroke();ctx.shadowBlur=0;
  }
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life/500));
    ctx.fillStyle=p.color; ctx.fillRect(p.x-cameraX,p.y,4,4);
  }
  ctx.globalAlpha=1;
}
function drawUI(){
  ctx.fillStyle="rgba(0,0,0,.35)"; ctx.fillRect(16,16,300,72);
  ctx.fillStyle="#fff"; ctx.font="bold 20px Yu Gothic";
  ctx.fillText(`HP ${"♥".repeat(player.hp)}${"♡".repeat(3-player.hp)}`,28,43);
  ctx.fillText(`IBO ${String(player.score).padStart(2,"0")}/${level.coins.length}`,28,72);
  const progress=Math.round(player.x/level.goalX*100);
  ctx.fillStyle="rgba(255,255,255,.28)"; ctx.fillRect(340,26,300,12);
  ctx.fillStyle="#8b49ff"; ctx.fillRect(340,26,300*clamp(progress/100,0,1),12);
  ctx.fillStyle="#fff"; ctx.font="14px Yu Gothic"; ctx.fillText(`${progress}%`,650,38);

  ctx.textAlign="right";ctx.font="bold 15px system-ui";ctx.fillStyle="#fff";ctx.fillText(`${stageIndex+1} / 3 · ${themes[stageIndex].name}`,W-24,34);ctx.textAlign="left";

}

function render(){
  drawBackground();
  drawPlatforms();
  drawCoins();
  drawGoal();
  for(const e of enemies) if(e.alive) drawSprite(e,true);
  drawSprite(player,false);
  drawShots();
  drawParticles();
  drawUI();
}

let accumulator=0;
function loop(t){
  const dt=last?Math.min(100,t-last):16.6667; last=t;
  if(mode==="playing"){
    accumulator+=dt;
    while(accumulator>=16.6667){update(16.6667);accumulator-=16.6667;if(mode!=="playing"){accumulator=0;break;}}
  }else accumulator=0;
  render(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
