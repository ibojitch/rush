<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>いぼ次元ラッシュ v0.31</title>
  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at top, #fff1d6 0%, #f7e4c9 55%, #e8c99a 100%);
      font-family: "Yu Gothic", sans-serif;
      user-select: none;
      padding-bottom: 90px;
    }
    canvas {
      display: block;
      margin: 20px auto;
      background: #fbe9d0;
      box-shadow: 0 18px 45px rgba(90,55,30,.25);
      border: 4px solid #c96;
      border-radius: 8px;
      width: 100%;
      max-width: 800px;
      height: auto;
      box-sizing: border-box;
    }
    #info {
      text-align: center;
      font-size: 14px;
      color: #444;
    }
    #controls {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      display: flex;
      gap: 8px;
      padding: 10px;
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
    }
    #controls button {
      flex: 1;
      font-size: 16px;
      padding: 12px 0;
      border: 2px solid #c96;
      border-radius: 6px;
      background: #fff4e6;
      color: #333;
    }

    #enterControls {
      position: fixed;
      bottom: 74px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 0 14px;
      box-sizing: border-box;
    }
    #enterControls button {
      width: 100%;
      max-width: 360px;
      font-size: 16px;
      padding: 10px 0;
      border: 2px solid #c96;
      border-radius: 6px;
      background: #ffe9d3;
      color: #333;
    }
  </style>
</head>
<body>
<canvas id="game" width="800" height="480"></canvas>
<div id="info">
  いぼ次元ラッシュ v0.31
  ← →：移動　／　Space：ジャンプ　／　I：いぼミサイル　／　Enter：スタート／次へ
</div>

<div id="enterControls">
  <button id="btnEnter">Enter (スタート/タイトル)</button>
</div>
<div id="controls">
  <button id="btnLeft">←</button>
  <button id="btnRight">→</button>
  <button id="btnJump">ジャンプ</button>
  <button id="btnMissile">ミサイル</button>
</div>

<script>
// ==== IboJigen Rush v0.10b =======================================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false; // ドット感維持

// 地面を画面のかなり下に
const GROUND_Y = 400;

// ゲーム状態
const STATE_TITLE      = 0;
const STATE_PLAYING    = 1;
const STATE_GAMEOVER   = 2;
const STATE_STAGE_CLEAR = 3;

// 演出・ゲームフィール
const HIT_FLASH_MS = 120;
const SHAKE_MS = 140;
const SHAKE_POWER = 7;
const PARTICLE_GRAVITY = 0.08;

// ジャンプ力（マイナスが上向き）
const PLAYER_JUMP_POWER = -16; // イボジッチ
const ENEMY_JUMP_POWER  = -13; // キレジッチ

// ビームの基準値
const BEAM_BASE_SPEED    = 9;     // px/フレーム
const BEAM_BASE_LIFE     = 1500;  // ms
const BEAM_BASE_COOLDOWN = 900;   // ms


// ===== SE / Web Audio =====
// 外部音声ファイルなし。レトロゲーム風SEをブラウザ内で合成する。
let audioCtx = null;
let masterGain = null;

function ensureAudio() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return null;
    audioCtx = new AudioContextClass();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.16;
    masterGain.connect(audioCtx.destination);
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function playTone({
  type = "square",
  freq = 440,
  endFreq = null,
  duration = 0.08,
  volume = 0.25,
  delay = 0
} = {}) {
  const ac = ensureAudio();
  if (!ac || !masterGain) return;

  const t0 = ac.currentTime + delay;
  const t1 = t0 + duration;
  const osc = ac.createOscillator();
  const gain = ac.createGain();

  osc.type = type;
  osc.frequency.setValueAtTime(Math.max(30, freq), t0);
  if (endFreq !== null) {
    osc.frequency.exponentialRampToValueAtTime(Math.max(30, endFreq), t1);
  }

  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, volume), t0 + Math.min(0.012, duration * 0.25));
  gain.gain.exponentialRampToValueAtTime(0.0001, t1);

  osc.connect(gain);
  gain.connect(masterGain);
  osc.start(t0);
  osc.stop(t1 + 0.02);
}

function playNoise(duration = 0.08, volume = 0.18, delay = 0) {
  const ac = ensureAudio();
  if (!ac || !masterGain) return;

  const sampleCount = Math.max(1, Math.floor(ac.sampleRate * duration));
  const buffer = ac.createBuffer(1, sampleCount, ac.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < sampleCount; i++) {
    const decay = 1 - i / sampleCount;
    data[i] = (Math.random() * 2 - 1) * decay;
  }

  const src = ac.createBufferSource();
  const filter = ac.createBiquadFilter();
  const gain = ac.createGain();
  const t0 = ac.currentTime + delay;

  filter.type = "bandpass";
  filter.frequency.value = 950;
  filter.Q.value = 0.7;
  gain.gain.setValueAtTime(volume, t0);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);

  src.buffer = buffer;
  src.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  src.start(t0);
}

function sfxStart() {
  playTone({ type:"square", freq:392, endFreq:523, duration:0.07, volume:0.20 });
  playTone({ type:"square", freq:523, endFreq:659, duration:0.09, volume:0.18, delay:0.07 });
}

function sfxJump() {
  playTone({ type:"square", freq:300, endFreq:620, duration:0.12, volume:0.20 });
}

function sfxMissile() {
  playTone({ type:"square", freq:760, endFreq:280, duration:0.10, volume:0.15 });
  playTone({ type:"triangle", freq:980, endFreq:520, duration:0.06, volume:0.08, delay:0.015 });
}

function sfxBeam() {
  playTone({ type:"sawtooth", freq:220, endFreq:520, duration:0.13, volume:0.10 });
}

function sfxEnemyHit() {
  playNoise(0.07, 0.16);
  playTone({ type:"square", freq:190, endFreq:110, duration:0.10, volume:0.18 });
}

function sfxPlayerHit() {
  playNoise(0.10, 0.20);
  playTone({ type:"sawtooth", freq:150, endFreq:70, duration:0.16, volume:0.16 });
}

function sfxStageClear() {
  [523, 659, 784, 1047].forEach((f, i) => {
    playTone({ type:"square", freq:f, duration:0.11, volume:0.16, delay:i * 0.09 });
  });
}

function sfxVictory() {
  [523, 659, 784, 1047, 1319].forEach((f, i) => {
    playTone({ type:i < 4 ? "square" : "triangle", freq:f, duration:i === 4 ? 0.28 : 0.10, volume:0.17, delay:i * 0.09 });
  });
}

function sfxDefeat() {
  [330, 277, 220, 165].forEach((f, i) => {
    playTone({ type:"square", freq:f, duration:0.15, volume:0.14, delay:i * 0.12 });
  });
}

// ===== スプライトアトラス =====
// 512x256 / 1タイル64x128 / 8列x2行
// 0行目: イボジッチ、1行目: キレジッチ
// frame 0-1: idle / 2-5: walk / 6: jump rise / 7: jump fall-land
const spriteAtlas = new Image();
spriteAtlas.src = "ibojigen_sprite_atlas_512x256.png";

const SPRITE_W = 64;
const SPRITE_H = 128;
const SPRITE_DRAW_H = 210;
const SPRITE_DRAW_W = SPRITE_DRAW_H * (SPRITE_W / SPRITE_H);

let atlasReady = false;
let gameStarted = false;

spriteAtlas.onload = () => {
  atlasReady = true;
  if (!gameStarted) {
    gameStarted = true;
    startGame();
  }
};

// アトラスが無くてもゲームロジックは起動できる
spriteAtlas.onerror = () => {
  atlasReady = false;
  if (!gameStarted) {
    gameStarted = true;
    startGame();
  }
};

let state = STATE_TITLE;
let keys = {};
let lastTime = 0;

// ステージ 1〜3
let stage = 1;
const MAX_STAGE = 3;
let stageClearText = "";

class Fighter {
  constructor(x, colorBase, isEnemy=false) {
    this.x = x;
    this.y = GROUND_Y;
    this.w = 70;   // 当たり判定用
    this.h = 150;
    this.speed = 4;
    this.colorBase = colorBase;
    this.isEnemy = isEnemy;
    this.hp = 6;
    this.maxHp = 6;
    this.vy = 0;
    this.onGround = true;
    this.facing = isEnemy ? -1 : 1;
    this.missileCooldown = 0;
    this.beamCooldown = 0;
    this.aiMove = 0;
    this.aiBeam = false;
  }
  rect() {
    return {
      x: this.x - this.w / 2,
      y: this.y - this.h,
      w: this.w,
      h: this.h
    };
  }
}

const player = new Fighter(180, "#b673ff", false);
const enemy  = new Fighter(620, "#f5d3a5", true);

const btnLeft = document.getElementById("btnLeft");
const btnRight = document.getElementById("btnRight");
const btnJump = document.getElementById("btnJump");
const btnMissile = document.getElementById("btnMissile");
const btnEnter = document.getElementById("btnEnter");

let missiles = [];
let beams    = [];
let resultText = "";
let particles = [];
let screenShake = 0;
let playerHitFlash = 0;
let enemyHitFlash = 0;
let stageBannerTime = 0;
let combo = 0;
let comboTimer = 0;

// ===== 入力 =====
function attemptJump() {
  if (state === STATE_PLAYING && player.onGround) {
    ensureAudio();
    player.vy = PLAYER_JUMP_POWER;
    player.onGround = false;
    sfxJump();
  }
}

function attemptMissile() {
  if (state === STATE_PLAYING && player.missileCooldown === 0) {
    shootMissile();
  }
}

function handleEnterAction() {
  if (state === STATE_TITLE) {
    ensureAudio();
    stage = 1;
    resetGame();
    state = STATE_PLAYING;
    sfxStart();
    return;
  }

  if (state === STATE_GAMEOVER) {
    stage = 1;
    state = STATE_TITLE;
    return;
  }

  if (state === STATE_STAGE_CLEAR) {
    ensureAudio();
    stage++;
    if (stage > MAX_STAGE) stage = MAX_STAGE;
    resetGame();
    state = STATE_PLAYING;
    sfxStart();
  }
}

document.addEventListener("keydown", e => {
  keys[e.key] = true;

  if (["ArrowLeft","ArrowRight"," ","Spacebar","i","I"].includes(e.key)) {
    e.preventDefault();
  }

  if (state === STATE_TITLE && e.key === "Enter") {
    handleEnterAction();
  }

  if (state === STATE_GAMEOVER && e.key === "Enter") {
    // タイトルに戻す
    handleEnterAction();
  }

  if (state === STATE_STAGE_CLEAR && e.key === "Enter") {
    // 次ステージへ
    handleEnterAction();
  }

  if (state === STATE_PLAYING) {
    if (e.key === " " || e.key === "Spacebar") {
      attemptJump();
    }
    if (e.key === "i" || e.key === "I") {
      attemptMissile();
    }
  }
});

document.addEventListener("keyup", e => {
  keys[e.key] = false;
});

window.addEventListener("blur", () => {
  keys = {};
});

function setupTouchControls() {
  const bindHold = (button, key) => {
    const down = e => {
      e.preventDefault();
      keys[key] = true;
      if (key === " ") attemptJump();
      if (key === "I") attemptMissile();
      try { button.setPointerCapture(e.pointerId); } catch (_) {}
    };
    const up = e => {
      e.preventDefault();
      keys[key] = false;
    };
    button.addEventListener("pointerdown", down);
    button.addEventListener("pointerup", up);
    button.addEventListener("pointercancel", up);
    button.addEventListener("pointerleave", e => {
      if (e.buttons === 0) keys[key] = false;
    });
  };

  bindHold(btnLeft, "ArrowLeft");
  bindHold(btnRight, "ArrowRight");
  bindHold(btnJump, " ");
  bindHold(btnMissile, "I");

  btnEnter.addEventListener("pointerdown", e => {
    e.preventDefault();
    handleEnterAction();
  });
}

// ===== Utility =====
function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}
function rectIntersect(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

function resetGame() {
  // ステージ開始時に両者全回復・位置リセット
  player.x = 180;
  player.y = GROUND_Y;
  player.vy = 0;
  player.onGround = true;
  player.hp = player.maxHp;
  player.missileCooldown = 0;

  enemy.x = 620;
  enemy.y = GROUND_Y;
  enemy.vy = 0;
  enemy.onGround = true;
  enemy.hp = enemy.maxHp;
  enemy.beamCooldown = 0;

  missiles = [];
  beams = [];
  resultText = "";
  stageClearText = "";
  particles = [];
  screenShake = 0;
  playerHitFlash = 0;
  enemyHitFlash = 0;
  stageBannerTime = 1100;
  combo = 0;
  comboTimer = 0;
}

function update(dt) {
  if (state !== STATE_PLAYING) return;

  player.missileCooldown = Math.max(0, player.missileCooldown - dt);
  enemy.beamCooldown    = Math.max(0, enemy.beamCooldown - dt);
  playerHitFlash = Math.max(0, playerHitFlash - dt);
  enemyHitFlash = Math.max(0, enemyHitFlash - dt);
  screenShake = Math.max(0, screenShake - dt);
  stageBannerTime = Math.max(0, stageBannerTime - dt);
  comboTimer = Math.max(0, comboTimer - dt);
  if (comboTimer === 0) combo = 0;

  updatePlayer();
  updateEnemy(dt);
  updateMissiles();
  updateBeams(dt);
  updateParticles(dt);

  player.facing = (enemy.x >= player.x) ? 1 : -1;
  enemy.facing  = (player.x >= enemy.x) ? 1 : -1;

  if (player.hp <= 0) {
    state = STATE_GAMEOVER;
    resultText = "イボジッチ敗北…";
    sfxDefeat();
  } else if (enemy.hp <= 0) {
    if (stage < MAX_STAGE) {
      // ステージクリア → 次ステージへ
      state = STATE_STAGE_CLEAR;
      stageClearText = getStageClearMessage(stage);
      sfxStageClear();
    } else {
      // 最終ステージ撃破 → 完全勝利
      state = STATE_GAMEOVER;
      resultText = "勝利！いぼ次元制圧！";
      sfxVictory();
    }
  }
}

function getStageClearMessage(stageNum) {
  if (stageNum === 1) {
    return "キレジッチ「今のは俺の本気ではない」";
  } else if (stageNum === 2) {
    return "キレジッチ「！…まだだ、まだこれからだ」";
  }
  return "";
}

function applyGravity(f) {
  f.y += f.vy;
  if (!f.onGround) {
    f.vy += 0.6; // 重力
  }
  if (f.y >= GROUND_Y) {
    f.y = GROUND_Y;
    f.vy = 0;
    f.onGround = true;
  }
}

function updatePlayer() {
  if (keys["ArrowLeft"])  player.x -= player.speed;
  if (keys["ArrowRight"]) player.x += player.speed;
  player.x = clamp(player.x, 70, canvas.width - 70);
  applyGravity(player);
}

let enemyThinkTime = 0;
function updateEnemy(dt) {
  enemyThinkTime -= dt;
  if (enemyThinkTime <= 0) {
    enemyThinkTime = 400;
    enemyAiDecision();
  }

  enemy.x += enemy.aiMove * enemy.speed * 0.6;
  enemy.x = clamp(enemy.x, 70, canvas.width - 70);

  maybeEnemyDodgeJump(); // 回避ジャンプ

  applyGravity(enemy);

  if (enemy.aiBeam && enemy.beamCooldown === 0) {
    shootBeam();
  }
}

// ===== キレジッチAI =====
function enemyAiDecision() {
  const dist = player.x - enemy.x;
  const absDist = Math.abs(dist);

  enemy.aiMove = 0;
  enemy.aiBeam = false;

  if (absDist > 260) {
    enemy.aiMove = dist > 0 ? 1 : -1;
  } else if (absDist > 160) {
    enemy.aiBeam = Math.random() < 0.7;
    enemy.aiMove = dist > 0 ? 0.2 : -0.2;
  } else {
    enemy.aiMove = dist > 0 ? -0.6 : 0.6;
    enemy.aiBeam = Math.random() < 0.5;
  }
}

// ★ キレジッチ回避ジャンプ
function maybeEnemyDodgeJump() {
  if (!enemy.onGround) return;
  if (missiles.length === 0) return;

  let closest = null;
  let minDist = Infinity;
  missiles.forEach(m => {
    const d = Math.abs(m.x - enemy.x);
    if (d < minDist) {
      minDist = d;
      closest = m;
    }
  });
  if (!closest) return;

  const towardEnemy =
    (closest.vx > 0 && closest.x < enemy.x) ||
    (closest.vx < 0 && closest.x > enemy.x);

  if (!towardEnemy) return;

  const horizontalOk = Math.abs(closest.x - enemy.x) < 240;
  const dy = Math.abs(closest.y - (enemy.y - enemy.h * 0.5));
  const verticalOk = dy < 90;

  if (horizontalOk && verticalOk) {
    if (Math.random() < 0.6) {
      enemy.vy = ENEMY_JUMP_POWER;
      enemy.onGround = false;
    }
  }
}

// ===== イボミサイル =====
function shootMissile() {
  ensureAudio();
  player.missileCooldown = 350;
  sfxMissile();
  const dir = player.facing;
  const r = player.rect();
  const startX = player.x + dir * (player.w/2 + 8);
  const startY = r.y + r.h * 0.45;
  missiles.push({
    x: startX,
    y: startY,
    r: 10,
    vx: dir * 7.5,
    alive: true
  });
}

function updateMissiles() {
  missiles.forEach(m => {
    m.x += m.vx;
    if (m.x < -50 || m.x > canvas.width + 50) m.alive = false;

    const mr = { x: m.x - m.r, y: m.y - m.r, w: m.r*2, h: m.r*2 };
    if (rectIntersect(mr, enemy.rect())) {
      enemy.hp -= 1;
      enemyHitFlash = HIT_FLASH_MS;
      screenShake = SHAKE_MS;
      combo += 1;
      comboTimer = 1200;
      spawnBurst(m.x, m.y, 12, "#7e3cff");
      sfxEnemyHit();
      m.alive = false;
    }
  });
  missiles = missiles.filter(m => m.alive);
}

// ===== ビーム（ステージ性能反映） =====
function getBeamParamsForStage() {
  let speed     = BEAM_BASE_SPEED;
  let life      = BEAM_BASE_LIFE;
  let cooldown  = BEAM_BASE_COOLDOWN;
  let bidirect  = false;

  if (stage >= 2) {
    life *= 1.2;       // 射程1.2倍
    bidirect = true;   // 左右どちらにも撃てる
  }
  if (stage >= 3) {
    cooldown *= 0.8;   // 発射間隔 0.8倍（速くなる）
  }
  return { speed, life, cooldown, bidirect };
}

function shootBeam() {
  ensureAudio();
  const params = getBeamParamsForStage();
  sfxBeam();
  enemy.beamCooldown = params.cooldown;

  const r = enemy.rect();
  const bandageX = enemy.x;
  const bandageY = r.y + r.h * 0.02;

  const startX = bandageX - 4;
  const startY = bandageY - 4;

  // 向き決定：Stage1 は左固定、Stage2以降はプレイヤー側へ
  let dir = -1;
  if (params.bidirect) {
    dir = (player.x >= enemy.x) ? 1 : -1;
  }

  beams.push({
    x: startX,
    y: startY,
    w: 36,
    h: 8,
    vx: dir * params.speed,
    life: params.life,
    alive: true
  });
}

function updateBeams(dt) {
  beams.forEach(b => {
    b.x += b.vx;
    b.life -= dt;
    if (b.life <= 0 || b.x + b.w < 0 || b.x > canvas.width + 50) {
      b.alive = false;
    }

    if (rectIntersect(b, player.rect())) {
      player.hp -= 1;
      playerHitFlash = HIT_FLASH_MS;
      screenShake = SHAKE_MS;
      spawnBurst(b.x, b.y, 10, "#ff5f5f");
      sfxPlayerHit();
      b.alive = false;
    }
  });
  beams = beams.filter(b => b.alive);
}

function spawnBurst(x, y, count, color) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1.5 + Math.random() * 4;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
      life: 380 + Math.random() * 260, maxLife: 640,
      size: 2 + Math.random() * 4, color
    });
  }
}

function updateParticles(dt) {
  particles.forEach(p => {
    const f = dt / 16.6667;
    p.x += p.vx * f;
    p.y += p.vy * f;
    p.vy += PARTICLE_GRAVITY * f;
    p.life -= dt;
  });
  particles = particles.filter(p => p.life > 0);
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ===== 描画 =====
function drawBackground() {
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  sky.addColorStop(0, "#fff0cf");
  sky.addColorStop(1, "#f4cfa0");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 遠景
  ctx.fillStyle = "rgba(255,255,255,.34)";
  ctx.beginPath();
  ctx.arc(680, 88, 46, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = "rgba(188,145,111,.35)";
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y-30);
  ctx.lineTo(130, 260);
  ctx.lineTo(250, GROUND_Y-30);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(180, GROUND_Y-30);
  ctx.lineTo(340, 230);
  ctx.lineTo(500, GROUND_Y-30);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#e0b47a";
  ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

  ctx.fillStyle = "#d7a96b";
  ctx.fillRect(0, GROUND_Y - 22, canvas.width, 22);

  ctx.fillStyle = "#9ccc65";
  for (let i = 0; i < 6; i++) {
    const x = 60 + i * 130;
    ctx.beginPath();
    ctx.arc(x, GROUND_Y - 60, 30, 0, Math.PI * 2);
    ctx.fill();
  }

  const baseX = 600;
  const baseY = GROUND_Y - 22;
  ctx.strokeStyle = "#c48a5a";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(baseX - 40, baseY);
  ctx.lineTo(baseX, baseY - 150);
  ctx.lineTo(baseX + 40, baseY);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(baseX - 30, baseY - 50);
  ctx.lineTo(baseX + 30, baseY - 50);
  ctx.moveTo(baseX - 20, baseY - 90);
  ctx.lineTo(baseX + 20, baseY - 90);
  ctx.stroke();
}

function drawShadow(f) {
  ctx.fillStyle = "rgba(0,0,0,0.15)";
  const scale = f.onGround ? 1 : 0.8;
  ctx.beginPath();
  ctx.ellipse(f.x, GROUND_Y + 4, 28 * scale, 10 * scale, 0, 0, Math.PI * 2);
  ctx.fill();
}

function getSpriteFrame(f) {
  // ジャンプ中は上昇/下降で固定フレーム
  if (!f.onGround) return f.vy < 0 ? 6 : 7;

  // 移動中は4コマ歩行
  const moving = f.isEnemy
    ? Math.abs(f.aiMove) > 0.08
    : (keys["ArrowLeft"] || keys["ArrowRight"]);

  const now = performance.now();
  if (moving) return 2 + (Math.floor(now / 120) % 4);

  // 待機は2コマをゆっくり切り替え
  return Math.floor(now / 500) % 2;
}

function drawSpriteCharacter(f) {
  drawShadow(f);

  // アトラスが無い場合でも、当たり判定位置が分かる簡易キャラを描く
  if (!atlasReady || !spriteAtlas.complete || spriteAtlas.naturalWidth === 0) {
    const r = f.rect();
    ctx.save();
    ctx.fillStyle = f.colorBase;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = "#222";
    ctx.font = "14px 'Yu Gothic'";
    ctx.textAlign = "center";
    ctx.fillText(f.isEnemy ? "キレジッチ" : "イボジッチ", f.x, r.y - 6);
    ctx.restore();
    return;
  }

  const frame = getSpriteFrame(f);
  const row = f.isEnemy ? 1 : 0;
  const sx = frame * SPRITE_W;
  const sy = row * SPRITE_H;
  const dx = -SPRITE_DRAW_W / 2;
  const dy = -SPRITE_DRAW_H;

  // 元アセットの向き: イボジッチ=右、キレジッチ=左
  const nativeFacing = f.isEnemy ? -1 : 1;
  const flip = f.facing !== nativeFacing;

  ctx.save();
  ctx.translate(f.x, f.y);
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(
    spriteAtlas,
    sx, sy, SPRITE_W, SPRITE_H,
    dx, dy, SPRITE_DRAW_W, SPRITE_DRAW_H
  );
  ctx.restore();
}

function drawMissiles() {
  missiles.forEach(m => {
    ctx.beginPath();
    ctx.fillStyle = "#7e3cff";
    ctx.arc(m.x, m.y, m.r, 0, Math.PI*2);
    ctx.fill();

    ctx.strokeStyle = "#4b1d99";
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI * 2 / 6) * i;
      const x1 = m.x + Math.cos(a)*m.r;
      const y1 = m.y + Math.sin(a)*m.r;
      const x2 = m.x + Math.cos(a)*(m.r+6);
      const y2 = m.y + Math.sin(a)*(m.r+6);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
  });
}

function drawBeams() {
  beams.forEach(b => {
    const grad = ctx.createLinearGradient(b.x, b.y, b.x + b.w, b.y);
    grad.addColorStop(0,   "rgba(255,230,230,0.15)");
    grad.addColorStop(0.3, "rgba(255,120,120,0.9)");
    grad.addColorStop(1,   "rgba(120,0,0,0.9)");
    ctx.fillStyle = grad;
    ctx.fillRect(b.x, b.y, b.w, b.h);

    ctx.fillStyle = "rgba(255,0,0,0.25)";
    ctx.fillRect(b.x, b.y - 4, b.w, b.h + 8);
  });
}

function drawHpBar(f, x, y) {
  const w = 180;
  const h = 16;
  ctx.fillStyle = "#ddd";
  ctx.fillRect(x, y, w, h);
  const ratio = f.hp / f.maxHp;
  ctx.fillStyle = f === player ? "#a040ff" : "#ff5f5f";
  ctx.fillRect(x, y, w * ratio, h);
  ctx.strokeStyle = "#333";
  ctx.strokeRect(x, y, w, h);
}

function drawStageLabel() {
  ctx.fillStyle = "#333";
  ctx.font = "18px 'Yu Gothic'";
  ctx.fillText("STAGE " + stage, canvas.width/2 - 40, 26);
}

function drawTitle() {
  drawBackground();

  ctx.fillStyle = "#d84315";
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 6;
  ctx.font = "bold 64px 'Yu Gothic'";
  const title = "いぼ次元ラッシュ";
  const tw = ctx.measureText(title).width;
  ctx.strokeText(title, (canvas.width - tw)/2, 140);
  ctx.fillText(title, (canvas.width - tw)/2, 140);

  ctx.font = "24px 'Yu Gothic'";
  ctx.fillStyle = "#444";
  ctx.fillText("Enterキーでスタート", canvas.width/2 - 110, 200);

  ctx.font = "16px 'Yu Gothic'";
  ctx.fillText("← →：移動　Space：ジャンプ　I：いぼミサイル", canvas.width/2 - 170, 230);

  drawStageLabel();
  drawSpriteCharacter(player);
  drawSpriteCharacter(enemy);
}

function drawGame() {
  drawBackground();
  drawSpriteCharacter(player);
  drawSpriteCharacter(enemy);

  drawMissiles();
  drawBeams();
  drawParticles();

  drawHpBar(player, 40, 40);
  drawHpBar(enemy, canvas.width - 220, 40);
  drawStageLabel();

  if (combo >= 2 && comboTimer > 0) {
    ctx.fillStyle = "#7e3cff";
    ctx.font = "bold 22px 'Yu Gothic'";
    ctx.fillText(combo + " HIT!", 40, 88);
  }

  if (stageBannerTime > 0) {
    ctx.fillStyle = "rgba(0,0,0,.28)";
    ctx.fillRect(0, 165, canvas.width, 86);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 34px 'Yu Gothic'";
    const t = "STAGE " + stage;
    const tw = ctx.measureText(t).width;
    ctx.fillText(t, (canvas.width-tw)/2, 218);
  }

  ctx.fillStyle = "#444";
  ctx.font = "16px 'Yu Gothic'";
  ctx.fillText("イボジッチ", 40, 30);
  ctx.fillText("キレジッチ", canvas.width - 220, 30);
}

function drawGameOver() {
  drawGame();

  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#fff";
  ctx.font = "bold 40px 'Yu Gothic'";
  const tw = ctx.measureText(resultText).width;
  ctx.fillText(resultText, (canvas.width - tw)/2, 200);

  ctx.font = "22px 'Yu Gothic'";
  const msg = "Enterキーでタイトルにもどる";
  const tw2 = ctx.measureText(msg).width;
  ctx.fillText(msg, (canvas.width - tw2)/2, 240);
}

function drawStageClear() {
  drawGame();

  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#fff";
  ctx.font = "bold 34px 'Yu Gothic'";
  const tw = ctx.measureText("STAGE " + stage + " CLEAR").width;
  ctx.fillText("STAGE " + stage + " CLEAR", (canvas.width - tw)/2, 180);

  ctx.font = "22px 'Yu Gothic'";
  ctx.fillText(stageClearText, canvas.width/2 - 220, 220);

  const msg = "Enterキーで次のステージへ";
  const tw2 = ctx.measureText(msg).width;
  ctx.fillText(msg, (canvas.width - tw2)/2, 270);
}

// ===== メインループ =====
function loop(timestamp) {
  const dt = lastTime === 0 ? 0 : Math.min(timestamp - lastTime, 50);
  lastTime = timestamp;

  ctx.save();
  if (screenShake > 0 && state === STATE_PLAYING) {
    const k = screenShake / SHAKE_MS;
    ctx.translate((Math.random()-0.5)*SHAKE_POWER*k, (Math.random()-0.5)*SHAKE_POWER*k);
  }
  if (state === STATE_TITLE) {
    drawTitle();
  } else if (state === STATE_PLAYING) {
    update(dt);
    drawGame();
  } else if (state === STATE_GAMEOVER) {
    drawGameOver();
  } else if (state === STATE_STAGE_CLEAR) {
    drawStageClear();
  }
  ctx.restore();

  requestAnimationFrame(loop);
}

function startGame() {
  resetGame();
  requestAnimationFrame(loop);
}

setupTouchControls();
</script>
