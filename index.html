addEventListener("keydown", e => {
  const key=e.key.toLowerCase();

  keys[key] = true;
  if (["arrowleft","arrowright"," ","z","a","b","c","d","i","p","s","v","x","r"].includes(key)||debugMode&&(["f","1","2","3","4","5"].includes(key))) e.preventDefault();
  if(debugMode&&!e.repeat){if(key==="f"){debugFillLoadout();return;}if(/^[1-5]$/.test(key)){debugStartStage(Number(key));return;}}

  if(["p","b","s","v"].includes(key)&&!e.repeat)fireVoiceAttack(key);
});

function bindHold(id,key){
 const el=document.getElementById(id);let pointer=null;
 el.addEventListener("pointerdown",e=>{e.preventDefault();if(pointer!==null)return;pointer=e.pointerId;el.setPointerCapture(pointer);keys[key]=true;el.classList.add("pressed");});
 const up=e=>{if(e.pointerId!==pointer)return;keys[key]=false;pointer=null;el.classList.remove("pressed");};
 el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);el.addEventListener("lostpointercapture",up);
}

function bindStick(){
 const stick=document.getElementById("stick"),knob=document.getElementById("stickKnob");let pointer=null;
 const reset=()=>{keys.arrowleft=false;keys.arrowright=false;stick.setAttribute("aria-valuenow","0");if(knob.style)knob.style.transform="translate(0,0)";};
 const move=e=>{if(e.pointerId!==pointer)return;const r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),limit=r.width*.28,n=clamp(dx/limit,-1,1);keys.arrowleft=n<-.2;keys.arrowright=n>.2;stick.setAttribute("aria-valuenow",String(Math.round(n*100)/100));if(knob.style)knob.style.transform=`translate(${n*limit}px,0)`;};
 stick.addEventListener("pointerdown",e=>{e.preventDefault();if(pointer!==null)return;pointer=e.pointerId;stick.setPointerCapture(pointer);move(e);});
 stick.addEventListener("pointermove",move);
 const release=e=>{if(e.pointerId!==pointer)return;pointer=null;reset();};
 stick.addEventListener("pointerup",release);stick.addEventListener("pointercancel",release);stick.addEventListener("lostpointercapture",release);
}

function overlapCenter(a,b){
  const left=Math.max(a.x,b.x),right=Math.min(a.x+a.w,b.x+b.w);

}

function standingRect(o){return {x:o.x-o.w/2,y:o.y-o.h,w:o.w,h:o.h};}

function moveAndCollide(o, dtScale, platforms) {
  // horizontal
  o.x += o.vx*dtScale;
  let r=standingRect(o);
  for (const p of platforms) if (p.y>=FLOOR_Y && intersect(r,p)) {
    if (o.vx>0) o.x=p.x-o.w/2;
    else if (o.vx<0) o.x=p.x+p.w+o.w/2;
    r=standingRect(o);
  }

  // vertical
  o.vy += GRAVITY*dtScale;
  o.y += o.vy*dtScale;
  o.onGround=false;
  r=standingRect(o);
  for (const p of platforms) if (intersect(r,p)) {
    if (o.vy>0 && (r.y+r.h-o.vy*dtScale)<=p.y+8) {
      o.y=p.y; o.vy=0; o.onGround=true;
    } else if (o.vy<0 && p.y>=FLOOR_Y) {
      o.y=p.y+p.h+o.h; o.vy=0;
    }
    r=standingRect(o);
  }
}

function pointToSegmentDistance(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,span=dx*dx+dy*dy;
  const t=span?clamp(((px-x1)*dx+(py-y1)*dy)/span,0,1):0;
  return Math.hypot(px-(x1+dx*t),py-(y1+dy*t));
}

function update(dt) {
  const f=Math.min(2.2,dt/16.6667);
  if (mode!=="playing") {
    return;
  }

  const hadStar=player.starTime>0;
  player.starTime=Math.max(0,player.starTime-dt);
  if(hadStar&&player.starTime===0)resetMusic();
  updateMusic(dt);
  player.recoil=Math.max(0,player.recoil-dt);
  player.coyote=player.onGround?100:Math.max(0,player.coyote-dt);
  const jumpHeld=keys[" "]||keys["x"];
  if(jumpHeld&&!player._jumpLatch)player.jumpBuffer=120;
  else player.jumpBuffer=Math.max(0,player.jumpBuffer-dt);
  player._jumpLatch=!!jumpHeld;
  player.inv=Math.max(0,player.inv-dt);
  player.shotCd=Math.max(0,player.shotCd-dt);

  const left=keys["arrowleft"]||keys["a"], right=keys["arrowright"]||keys["d"];
  player.vx = left&&!right ? -player.speed : right&&!left ? player.speed : player.vx*.72;
  if (Math.abs(player.vx)<.08) player.vx=0;
  if (player.vx!==0) player.facing=Math.sign(player.vx);

  if(player.jumpBuffer>0 && player.coyote>0){
    player.vy=player.jump;player.onGround=false;player.airPeakY=player.y;player.coyote=0;player.jumpBuffer=0;sfx.jump();
    // Keep the take-off dust subtle so it does not obscure the player.
    spawnBurst(player.x,player.y,"#c99a68",5,.5);spawnBurst(player.x,player.y,"#ffe4a6",2,.35);
  }

  if (shotItemState==="collected"&&(keys["i"]||keys["z"]) && player.shotCd<=0 && !player._shotLatch) {
    player.shotCd=280; player._shotLatch=true;player.recoil=130;
    // A lighter, 20° lob: on flat ground it lands around half a screen away.
    const shotSpeed=7,shotAngle=Math.PI/9;
    shots.push({x:player.x+player.facing*34,y:player.y-42,vx:player.facing*shotSpeed*Math.cos(shotAngle),vy:-shotSpeed*Math.sin(shotAngle),r:7,alive:true,travelX:0});
    sfx.shot();spawnBurst(player.x+player.facing*30,player.y-42,"#d9c1ff",7,.8);spawnRing(player.x+player.facing*32,player.y-42,"#a374ff",12);
  }
  if (!(keys["i"]||keys["z"])) player._shotLatch=false;

  const wasGrounded=player.onGround;
  if(!wasGrounded)player.airPeakY=Math.min(player.airPeakY??player.y,player.y);
  moveAndCollide(player,f,level.platforms);
  if(!wasGrounded&&player.onGround&&player.vy===0){
    const fallDistance=Math.max(0,player.y-(player.airPeakY??player.y));
    const impact=clamp(.55+fallDistance/150,.55,2.1);
    spawnBurst(player.x,player.y,"#c99a68",Math.round(4+impact*4),impact*.65);
    spawnBurst(player.x,player.y,"#fff0be",Math.round(1+impact*2),impact*.45);
    screenShake=Math.max(screenShake,Math.max(0,impact-1)*3);
    player.airPeakY=player.y;
  }
  player.x=clamp(player.x,30,WORLD_W-30);
  if(level.bossGate!==null&&bossAlive()&&player.x>level.bossGate)player.x=level.bossGate;

  if(player.onGround && level.platforms.some(p=>player.y===p.y&&player.x>p.x+35&&player.x<p.x+p.w-35)){player.safeX=player.x;player.safeY=player.y;}
  // fall
  if (player.y>H+100) hurtPlayer(true);
  if(player.dead)return;

  // coins
  for(const c of level.coins){
    if(c.taken) continue;
    const dx=player.x-c.x, dy=(player.y-player.h/2)-c.y;
    if(dx*dx+dy*dy<28*28){
      c.taken=true;totalIbo++;awardScore(2);if(koeItemState==="collected"){voiceEnergy=Math.min(VOICE_ENERGY_MAX,voiceEnergy+5);syncVoiceUI();}sfx.coin();spawnBurst(c.x,c.y,"#ffd84d",6);
      if(totalIbo%10===0&&!starMilestones.has(totalIbo)){
        starMilestones.add(totalIbo);
        if(Math.random()<.5)powerups.push({type:"star",x:clamp(c.x+player.facing*100,45,WORLD_W-45),y:Math.max(90,c.y-25),alive:true});
      }
      if(runMaxHp<MAX_HP&&Math.random()<.01)powerups.push({type:"maxHeart",x:clamp(c.x+player.facing*135,45,WORLD_W-45),y:Math.max(90,c.y-38),alive:true});
    }
  }

  // Hearts remain on the map while HP is full, so healing is never wasted.
  for(const heart of level.hearts){
    if(heart.taken||player.hp>=player.maxHp)continue;
    const dx=player.x-heart.x,dy=(player.y-player.h/2)-heart.y;
    if(dx*dx+dy*dy<32*32){heart.taken=true;player.hp++;sfx.heal();spawnBurst(heart.x,heart.y,"#ff7895",14);}
  }

  for(const item of powerups){
    if(!item.alive)continue;
    const dx=player.x-item.x,dy=(player.y-player.h/2)-item.y;
    if(dx*dx+dy*dy<34*34){
      item.alive=false;
      if(item.type==="koe"){
        koeItemState="collected";koeDropPosition=null;koeDropStage=null;voiceEnergy=KOE_PICKUP_ENERGY;syncVoiceUI();syncControlsHelp();spawnBurst(item.x,item.y,"#c9f4ff",16,1.1);spawnRing(item.x,item.y,"#ff5d78",26);emitKoeEvent("collected",{stage:stageIndex+1});
      }else if(item.type==="shot"){
        shotItemState="collected";shotDropPosition=null;shotDropStage=null;syncShotUI();syncControlsHelp();sfx.shotUnlock();spawnBurst(item.x,item.y,"#d5b7ff",16,1.1);spawnRing(item.x,item.y,"#9a62ff",26);
      }else if(item.type==="maxHeart"){
        runMaxHp=Math.min(MAX_HP,runMaxHp+1);player.maxHp=runMaxHp;player.hp=player.maxHp;sfx.maxHp();spawnBurst(item.x,item.y,"#ff4f78",26);
      }else{
        player.starTime=8000;player.inv=0;resetMusic();sfx.star();spawnBurst(item.x,item.y,"#ffe45e",22);
      }
    }
  }
  powerups=powerups.filter(powerup=>powerup.alive);

  // enemies
  for(const e of enemies){
    if(!e.alive) continue;
    e.hitCooldown=Math.max(0,e.hitCooldown-dt);
    e.damageInv=Math.max(0,e.damageInv-dt);
    if(e.onGround){
      if(e.x<e.minX) e.vx=Math.abs(e.vx);
      if(e.x>e.maxX) e.vx=-Math.abs(e.vx);
    }
    e.facing=Math.sign(e.vx)||-1;
    e.phase+=dt*.003;
    if(e.type==="flyer"){
      e.x+=e.vx*f;if(e.x<e.minX||e.x>e.maxX)e.vx*=-1;
      e.y=FLOOR_Y-95+Math.sin(e.phase)*28;e.onGround=false;e.vy=0;
    }else{
      if(e.type==="hopper"){e.hopTimer-=dt;if(e.onGround&&e.hopTimer<=0){e.vy=-10;e.hopTimer=1400;}}
      if(e.onGround&&!level.platforms.some(p=>Math.abs(p.y-e.y)<3&&e.x+Math.sign(e.vx)*28>=p.x&&e.x+Math.sign(e.vx)*28<=p.x+p.w))e.vx*=-1;
      moveAndCollide(e,f,level.platforms);
    }
    if(enemyCanShoot(e.type)){
      e.beamCd-=dt;
      const originY=enemyAttackOriginY(e),dx=player.x-e.x,dy=(player.y-player.h*.55)-originY,distance=Math.hypot(dx,dy);
      if(e.beamCd<=0&&distance>120&&distance<620){
        const beam=beamTuning(stageIndex),speed=beam.speed;
        enemyShots.push({x:e.x+e.facing*16,y:originY,vx:dx/distance*speed,vy:dy/distance*speed,r:5,distance:0,alive:true});
        e.beamCd=beam.cooldown+Math.random()*beam.variance;sfx.enemyShot();
      }
    }
    if(e.type==="boss"){
      e.laserCd-=dt;
      if(e.laserCd<=0){
        const direction=Math.sign(player.x-e.x)||-1;
        bossLasers.push({x:e.x,y:enemyAttackOriginY(e),direction,age:0,warn:520,duration:1250,hit:false});
        e.laserCd=4300;sfx.bossLaser();
      }
    }
    const pr=standingRect(player), er=standingRect(e);
    if(intersect(pr,er)){
      if(e.type==="boss"){
        knockBackFromBoss(e);
      }else if(player.starTime>0){
        damageEnemy(e);player.vy=-6;spawnBurst(e.x,e.y-35,"#ffe45e",22,1.45);spawnRing(e.x,e.y-35,"#ffe45e",30);screenShake=Math.max(screenShake,5);sfx.hit();
      }else if(player.inv<=0){
        const playerBottom=pr.y+pr.h;
        if(e.type!=="hopper"&&player.vy>2 && playerBottom-er.y<30){
          damageEnemy(e,"stomp");player.vy=-9;spawnBurst(e.x,e.y-35,"#f5d3a5",16,1.25);spawnRing(e.x,e.y-35,"#ffd59f",24);screenShake=Math.max(screenShake,4);sfx.hit();
        } else hurtPlayer(false);
      }
    }
  }

  // shots
  for(const s of shots){
    if(!s.alive) continue;
    const previousY=s.y,moveX=s.vx*f;
    s.x+=moveX;s.travelX+=Math.abs(moveX);s.y+=s.vy*f;s.vy+=.20*f;
    const shotRect={x:s.x-s.r,y:s.y-s.r,w:s.r*2,h:s.r*2};
    const hitPlatform=level.platforms.some(p=>intersect(shotRect,p)||(s.vy>0&&previousY+s.r<=p.y&&s.y+s.r>=p.y&&s.x+s.r>p.x&&s.x-s.r<p.x+p.w));
    if(hitPlatform){s.alive=false;spawnBurst(s.x,s.y,"#cdb3ff",4);continue;}
    const sr={x:s.x-s.r,y:s.y-s.r,w:s.r*2,h:s.r*2};
    for(const e of enemies){
      if(!e.alive) continue;
      if(intersect(sr,standingRect(e))){
        damageEnemy(e);s.alive=false;spawnBurst(e.x,e.y-35,"#8e55ff",18,1.35);spawnRing(e.x,e.y-35,"#d3b5ff",28);screenShake=Math.max(screenShake,5);sfx.hit();break;
      }
    }
  }
  shots=shots.filter(s=>s.alive);

  // Voice attacks have no world-range cap. They clear only after leaving the camera view or on impact.
  for(const voice of voiceAttacks){
    if(!voice.alive)continue;
    const stepX=voice.vx*f,remaining=voice.range-voice.travel,moveX=Math.sign(stepX)*Math.min(Math.abs(stepX),remaining);
    voice.x+=moveX;voice.travel+=Math.abs(moveX);
    const vr={x:voice.direction<0?voice.x-voice.w:voice.x,y:voice.y-voice.h,w:voice.w,h:voice.h};
    const hitPlatform=level.platforms.some(p=>intersect(vr,p));
    let hitEnemy=false,hitPoint=null;
    for(const e of enemies){
      const enemyRect=standingRect(e);
      if(e.alive&&intersect(vr,enemyRect)){hitPoint=overlapCenter(vr,enemyRect);damageEnemy(e);hitEnemy=true;break;}
    }
    if(hitPlatform||hitEnemy){voice.alive=false;if(hitEnemy){spawnVoiceFog(hitPoint.x,hitPoint.y,voice.direction,true);sfx.hit();}spawnBurst(voice.x,voice.y-24,"#ffe65a",18,1.45);spawnRing(voice.x,voice.y-24,"#ffe65a",22);continue;}
    if(voice.travel>=voice.range){voice.alive=false;spawnBurst(voice.x,voice.y-24,"#ffe65a",12,1);continue;}
    const screenX=voice.x-cameraX;
    if(voice.direction<0?screenX<-20:screenX>W+20)voice.alive=false;
  }
  voiceAttacks=voiceAttacks.filter(voice=>voice.alive);

  // Enemy head beams start in stage 3 and become faster/more frequent later.
  for(const beam of enemyShots){
    if(!beam.alive)continue;
    beam.x+=beam.vx*f;beam.y+=beam.vy*f;beam.distance+=Math.hypot(beam.vx*f,beam.vy*f);
    const br={x:beam.x-beam.r,y:beam.y-beam.r,w:beam.r*2,h:beam.r*2};
    if(beam.distance>720||level.platforms.some(p=>intersect(br,p))){beam.alive=false;continue;}
    if(intersect(br,standingRect(player))){beam.alive=false;hurtPlayer(false);}
  }
  enemyShots=enemyShots.filter(beam=>beam.alive);

  for(const laser of bossLasers){
    laser.age+=dt;
    const sweep=clamp((laser.age-laser.warn)/laser.duration,0,1);
    laser.angle=laser.direction<0?Math.PI+.68-sweep*1.36:-.68+sweep*1.36;
    if(laser.age>=laser.warn&&!laser.hit){
      const endX=laser.x+Math.cos(laser.angle)*720,endY=laser.y+Math.sin(laser.angle)*720;
      if(pointToSegmentDistance(player.x,player.y-player.h*.52,laser.x,laser.y,endX,endY)<28){laser.hit=true;hurtPlayer(false);}
    }
  }
  bossLasers=bossLasers.filter(laser=>laser.age<laser.warn+laser.duration);

  goalPulse+=dt;
  if (player.x>level.goalX && !(stageIndex===STAGE_COUNT-1&&bossAlive())) {
    player.clear=true;
    if(!clearPlayed){clearPlayed=true;awardScore(10);sfx.clear();spawnBurst(level.goalX,315,themes[stageIndex].mist,42,2);spawnRing(level.goalX,315,"#ffffff",72);screenShake=7;}
    setMode("clear");
  }

  // camera follow
  const target=clamp(player.x-W*0.36,0,WORLD_W-W);
  cameraX += (target-cameraX)*Math.min(1,.08*f);

  screenShake=Math.max(0,screenShake-dt*.018);
  updateParticles(f,dt);
}

function hurtPlayer(fall){
  if(player.dead)return;
  if(player.starTime>0){if(fall){player.x=player.safeX;player.y=player.safeY;player.vx=0;player.vy=0;}return;}
  if(!fall&&player.inv>0)return;
  player.hp--;sfx.hit();spawnBurst(player.x,player.y-40,"#ff89a4",20,1.3);spawnRing(player.x,player.y-40,"#ffb0bf",26);screenShake=Math.max(screenShake,7);
  if(player.hp<=0){player.dead=true;setMode("dead");return;}
  player.inv=1200;
  if(fall){player.x=player.safeX;player.y=player.safeY;player.vx=0;player.vy=0;}
  else {player.x=clamp(player.x-player.facing*18,30,WORLD_W-30);player.vy=-6;}
}
function updateParticles(f,dt){
  for(const p of particles){ p.x+=p.vx*f; p.y+=p.vy*f; p.vy+=.18*f; p.life-=dt; }
  particles=particles.filter(p=>p.life>0);
  for(const ring of rings){ring.life-=dt;ring.radius+=f*1.2;}
  rings=rings.filter(ring=>ring.life>0);
  for(const fog of voiceFog){fog.x+=fog.vx*f;fog.y+=fog.vy*f;fog.vy-=.003*f;fog.radius+=fog.grow*dt;fog.life-=dt;}
  voiceFog=voiceFog.filter(fog=>fog.life>0);
}

// ---- draw ----
function spriteFrame(o,isEnemy){
  if(!o.onGround) return o.vy<0?6:7;
  const moving=Math.abs(o.vx)>.25;
  return moving?2+(Math.floor(performance.now()/115)%4):Math.floor(performance.now()/520)%2;
}
function playerIsGold(){
  return player.starTime>0&&(player.starTime>1000||Math.floor((1000-player.starTime)/50)%2===1);
}
function drawSprite(o,isEnemy=false){
  const frame=SPRITE_TILES[isEnemy?1:0][spriteFrame(o,isEnemy)];
  const nativeFacing=isEnemy?-1:1;
  const flip=o.facing!==nativeFacing;
  const scale=(isEnemy?(o.type==="boss"?126:86):96)/SPRITE_TILES[isEnemy?1:0][0].h;
  const drawH=frame.h*scale, drawW=frame.w*scale;
  ctx.save();
  ctx.translate(o.x-cameraX,o.y);
  const bossBlink=isEnemy&&o.type==="boss"&&o.damageInv>0&&Math.floor(performance.now()/70)%2===0;
  if(!bossBlink){ctx.fillStyle="#24213925";ctx.beginPath();ctx.ellipse(0,1,24,5,0,0,Math.PI*2);ctx.fill();}
  if(isEnemy && o.type==="flyer"){ctx.fillStyle="#d9eaffbb";for(const side of [-1,1]){ctx.beginPath();ctx.ellipse(side*32,-43,20,8,side*Math.sin(o.phase*4)*.5,0,Math.PI*2);ctx.fill();}}
  if(isEnemy && o.type==="hopper"){ctx.fillStyle="#ffcc72";ctx.beginPath();ctx.moveTo(-12,-87);ctx.lineTo(0,-103);ctx.lineTo(12,-87);ctx.fill();}
  if(o===player && player.recoil>0)ctx.rotate(-player.facing*.08*player.recoil/130);
  if(player.inv>0 && o===player && Math.floor(performance.now()/70)%2===0) ctx.globalAlpha=.35;
  if(flip) ctx.scale(-1,1);
  const starGold=o===player&&playerIsGold();
  if(starGold)ctx.filter="sepia(1) saturate(7) hue-rotate(355deg) brightness(1.45)";
  if(isEnemy&&o.type==="boss")ctx.filter="hue-rotate(165deg) saturate(2.4) brightness(.72) contrast(1.15)";
  if(!bossBlink){if(atlasReady) ctx.drawImage(atlas,frame.x,frame.y,frame.w,frame.h,-drawW/2,-drawH,drawW,drawH);
  else {ctx.fillStyle=isEnemy?"#f5d3a5":starGold?"#ffd84d":"#b673ff"; ctx.fillRect(-20,-70,40,70);}}
  if(isEnemy&&o.type==="boss"){ctx.filter="none";ctx.fillStyle="#15224c";ctx.fillRect(-38,-drawH-17,76,8);ctx.fillStyle="#68d6ff";ctx.fillRect(-37,-drawH-16,74*o.hp/o.maxHp,6);ctx.strokeStyle="#d9f8ff";ctx.lineWidth=1;ctx.strokeRect(-38,-drawH-17,76,8);}
  ctx.restore();
}

function drawBackground(){
  const theme=themes[stageIndex];
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,theme.sky[0]); g.addColorStop(.65,theme.sky[1]); g.addColorStop(1,theme.sky[2]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const time=performance.now()*.001;
  // Distant landmarks move slowly; the middle mountains and foreground move faster.
  drawSkyLandmark(stageIndex,time,theme);
  drawMountainLayer(theme.mountains[0], .12, 330, 110, 320);
  drawMountainLayer(theme.mountains[1], .22, 380, 145, 260);
  drawAtmosphere(stageIndex,time,theme);

}

function drawMountainLayer(color, factor, baseY, amp, step){
  ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(0,H);
  let x0=-(cameraX*factor)%step-step;
  ctx.lineTo(x0,baseY);
  for(let x=x0;x<W+step;x+=step){
    ctx.lineTo(x+step*.5,baseY-amp);
    ctx.lineTo(x+step,baseY);
  }
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
}

  for(const p of level.platforms){

function shotTrailEndpoints(shot){
  const x=shot.x-cameraX,angle=Math.atan2(shot.vy,shot.vx);
  return {x,y:shot.y,tailX:x-Math.cos(angle)*30,tailY:shot.y-Math.sin(angle)*30};
}
function drawShots(){
  for(const s of shots){

    ctx.save();ctx.strokeStyle=trail;ctx.lineWidth=9;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(tailX,tailY);ctx.lineTo(x,y);ctx.stroke();ctx.restore();
    ctx.fillStyle="#f2dcff";ctx.shadowColor="#a374ff";ctx.shadowBlur=14; ctx.strokeStyle="#8b49ff"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(x,y,s.r,0,Math.PI*2); ctx.fill(); ctx.stroke();ctx.shadowBlur=0;

}

  }
}
function drawBossLasers(){
  for(const laser of bossLasers){
    const x=laser.x-cameraX,active=laser.age>=laser.warn,alpha=active?.86:.24;
    const endX=x+Math.cos(laser.angle)*720,endY=laser.y+Math.sin(laser.angle)*720;
    ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle="#ff193f";ctx.lineWidth=active?11:4;ctx.shadowColor="#ff193f";ctx.shadowBlur=active?24:12;ctx.beginPath();ctx.moveTo(x,laser.y);ctx.lineTo(endX,endY);ctx.stroke();ctx.strokeStyle="#fff3f5";ctx.lineWidth=active?3:1;ctx.beginPath();ctx.moveTo(x,laser.y);ctx.lineTo(endX,endY);ctx.stroke();ctx.restore();
  }
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life/500));
    ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=7;ctx.fillRect(p.x-cameraX-p.size/2,p.y-p.size/2,p.size,p.size);
  }
  ctx.shadowBlur=0;
  for(const fog of voiceFog){
    const fade=Math.max(0,fog.life/fog.maxLife);
    ctx.globalAlpha=fade*fade*fog.opacity;ctx.fillStyle=fog.color;ctx.beginPath();ctx.ellipse(fog.x-cameraX,fog.y,fog.radius*1.35,fog.radius,0,0,Math.PI*2);ctx.fill();
  }
  for(const ring of rings){ctx.globalAlpha=Math.max(0,ring.life/ring.maxLife)*.8;ctx.strokeStyle=ring.color;ctx.lineWidth=2+ring.life/ring.maxLife*2;ctx.beginPath();ctx.arc(ring.x-cameraX,ring.y,ring.radius,0,Math.PI*2);ctx.stroke();}
  ctx.globalAlpha=1;
}
function drawHudHeart(x,y,filled){
  ctx.save();ctx.translate(x,y);ctx.scale(.76,.76);ctx.beginPath();ctx.moveTo(0,12);
  ctx.bezierCurveTo(-18,0,-16,-14,-7,-14);ctx.bezierCurveTo(-2,-14,0,-10,0,-6);
  ctx.bezierCurveTo(0,-10,2,-14,7,-14);ctx.bezierCurveTo(16,-14,18,0,0,12);
  ctx.lineWidth=2.4;ctx.strokeStyle="#ff5e78";if(filled){ctx.fillStyle="#ff5e78";ctx.fill();}ctx.stroke();ctx.restore();
}
function drawUI(){
  ctx.fillStyle="rgba(0,0,0,.35)"; ctx.fillRect(16,16,300,koeItemState==="collected"?94:72);
  ctx.fillStyle="#fff"; ctx.font="bold 20px Yu Gothic";
  ctx.fillText("HP ",28,43);for(let i=0;i<player.maxHp;i++)drawHudHeart(74+i*28,35,i<player.hp);
  ctx.fillText(`SCORE ${String(totalScore).padStart(3,"0")}  BEST ${String(highScore).padStart(3,"0")}`,28,72);
  if(koeItemState==="collected"){
    ctx.fillStyle="#513f24";ctx.fillRect(28,88,126,8);ctx.strokeStyle="#ff9b3d";ctx.lineWidth=2;ctx.strokeRect(27,87,128,10);ctx.fillStyle="#ffe75a";ctx.fillRect(28,88,126*voiceEnergy/VOICE_ENERGY_MAX,8);ctx.fillStyle="#fff5bd";ctx.font="bold 13px Yu Gothic";ctx.fillText(`声 ${voiceEnergy}`,162,95);
  }
  const progress=Math.round(player.x/level.goalX*100);
  ctx.fillStyle="rgba(255,255,255,.28)"; ctx.fillRect(340,26,300,12);
  ctx.fillStyle="#8b49ff"; ctx.fillRect(340,26,300*clamp(progress/100,0,1),12);
  ctx.fillStyle="#fff"; ctx.font="14px Yu Gothic"; ctx.fillText(`${progress}%`,650,38);

  ctx.textAlign="right";ctx.font="bold 15px system-ui";ctx.fillStyle="#fff";ctx.fillText(`${stageIndex+1} / ${STAGE_COUNT} · ${themes[stageIndex].name}`,W-24,34);ctx.textAlign="left";
  if(player.starTime>0){ctx.textAlign="right";ctx.fillStyle="#ffe45e";ctx.fillText(`★ ${Math.ceil(player.starTime/1000)}s`,W-24,62);ctx.textAlign="left";}
  if(debugMode){ctx.textAlign="right";ctx.fillStyle="#ffe75a";ctx.font="bold 16px system-ui";ctx.fillText("[DEBUG]",W-24,88);ctx.textAlign="left";}

}

function render(){
  ctx.save();
  if(screenShake>0){const shake=screenShake;ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);}
  drawBackground();
  drawPlatforms();
  drawCoins();
  drawHearts();
  drawPowerups();
  drawGoal();
  drawBossGate();
  for(const e of enemies) if(e.alive) drawSprite(e,true);
  drawBossLasers();
  drawSprite(player,false);
  drawShots();
  drawVoiceAttacks();
  drawEnemyShots();
  drawParticles();
  ctx.restore();
  drawUI();
}

let accumulator=0;
function loop(t){
  const dt=last?Math.min(100,t-last):16.6667; last=t;
  if(mode==="playing"){
    accumulator+=dt;
    while(accumulator>=16.6667){update(16.6667);accumulator-=16.6667;if(mode!=="playing"){accumulator=0;break;}}
  }else accumulator=0;
  render(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
