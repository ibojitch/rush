name: Install SE patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-se.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')

          def rep(old, new, count=1):
              global t
              if old not in t:
                  raise SystemExit('patch target not found: ' + old[:80])
              t = t.replace(old, new, count)

          rep('<title>いぼ次元ラッシュ v0.30</title>', '<title>いぼ次元ラッシュ v0.31</title>')
          rep('いぼ次元ラッシュ v0.30', 'いぼ次元ラッシュ v0.31')

          audio = r'''
          // ===== SE / Web Audio =====
          // 外部音声ファイルなし。レトロゲーム風SEをブラウザ内で合成する。
          let audioCtx = null;
          let masterGain = null;

          function ensureAudio() {
            if (!audioCtx) {
              const AC = window.AudioContext || window.webkitAudioContext;
              if (!AC) return null;
              audioCtx = new AC();
              masterGain = audioCtx.createGain();
              masterGain.gain.value = 0.16;
              masterGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === "suspended") audioCtx.resume();
            return audioCtx;
          }

          function playTone(type="square", freq=440, endFreq=null, duration=0.08, volume=0.25, delay=0) {
            const ac = ensureAudio();
            if (!ac || !masterGain) return;
            const t0 = ac.currentTime + delay, t1 = t0 + duration;
            const osc = ac.createOscillator(), gain = ac.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(Math.max(30, freq), t0);
            if (endFreq !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(30, endFreq), t1);
            gain.gain.setValueAtTime(0.0001, t0);
            gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, volume), t0 + Math.min(0.012, duration * 0.25));
            gain.gain.exponentialRampToValueAtTime(0.0001, t1);
            osc.connect(gain); gain.connect(masterGain);
            osc.start(t0); osc.stop(t1 + 0.02);
          }

          function playNoise(duration=0.08, volume=0.18) {
            const ac = ensureAudio();
            if (!ac || !masterGain) return;
            const n = Math.max(1, Math.floor(ac.sampleRate * duration));
            const buf = ac.createBuffer(1, n, ac.sampleRate), data = buf.getChannelData(0);
            for (let i=0; i<n; i++) data[i] = (Math.random()*2-1) * (1-i/n);
            const src = ac.createBufferSource(), filter = ac.createBiquadFilter(), gain = ac.createGain();
            filter.type = "bandpass"; filter.frequency.value = 950; filter.Q.value = 0.7;
            gain.gain.setValueAtTime(volume, ac.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + duration);
            src.buffer = buf; src.connect(filter); filter.connect(gain); gain.connect(masterGain); src.start();
          }

          function sfxStart(){ playTone("square",392,523,.07,.20); playTone("square",523,659,.09,.18,.07); }
          function sfxJump(){ playTone("square",300,620,.12,.20); }
          function sfxMissile(){ playTone("square",760,280,.10,.15); playTone("triangle",980,520,.06,.08,.015); }
          function sfxBeam(){ playTone("sawtooth",220,520,.13,.10); }
          function sfxEnemyHit(){ playNoise(.07,.16); playTone("square",190,110,.10,.18); }
          function sfxPlayerHit(){ playNoise(.10,.20); playTone("sawtooth",150,70,.16,.16); }
          function sfxStageClear(){ [523,659,784,1047].forEach((f,i)=>playTone("square",f,null,.11,.16,i*.09)); }
          function sfxVictory(){ [523,659,784,1047,1319].forEach((f,i)=>playTone(i<4?"square":"triangle",f,null,i===4?.28:.10,.17,i*.09)); }
          function sfxDefeat(){ [330,277,220,165].forEach((f,i)=>playTone("square",f,null,.15,.14,i*.12)); }
          '''
          rep('// ===== スプライトアトラス =====', audio + '\n// ===== スプライトアトラス =====')

          rep('''function attemptJump() {
            if (state === STATE_PLAYING && player.onGround) {
              player.vy = PLAYER_JUMP_POWER;
              player.onGround = false;
            }
          }''', '''function attemptJump() {
            if (state === STATE_PLAYING && player.onGround) {
              ensureAudio();
              player.vy = PLAYER_JUMP_POWER;
              player.onGround = false;
              sfxJump();
            }
          }''')

          rep('''  if (state === STATE_TITLE) {
            stage = 1;
            resetGame();
            state = STATE_PLAYING;
            return;
          }''', '''  if (state === STATE_TITLE) {
            ensureAudio();
            stage = 1;
            resetGame();
            state = STATE_PLAYING;
            sfxStart();
            return;
          }''')

          rep('''  if (state === STATE_STAGE_CLEAR) {
            stage++;
            if (stage > MAX_STAGE) stage = MAX_STAGE;
            resetGame();
            state = STATE_PLAYING;
          }''', '''  if (state === STATE_STAGE_CLEAR) {
            ensureAudio();
            stage++;
            if (stage > MAX_STAGE) stage = MAX_STAGE;
            resetGame();
            state = STATE_PLAYING;
            sfxStart();
          }''')

          rep('''function shootMissile() {
            player.missileCooldown = 350;''', '''function shootMissile() {
            ensureAudio();
            player.missileCooldown = 350;
            sfxMissile();''')

          rep('''function shootBeam() {
            const params = getBeamParamsForStage();''', '''function shootBeam() {
            ensureAudio();
            const params = getBeamParamsForStage();
            sfxBeam();''')

          rep('''      spawnBurst(m.x, m.y, 12, "#7e3cff");
              m.alive = false;''', '''      spawnBurst(m.x, m.y, 12, "#7e3cff");
              sfxEnemyHit();
              m.alive = false;''')

          rep('''      spawnBurst(b.x, b.y, 10, "#ff5f5f");
              b.alive = false;''', '''      spawnBurst(b.x, b.y, 10, "#ff5f5f");
              sfxPlayerHit();
              b.alive = false;''')

          rep('''  if (player.hp <= 0) {
            state = STATE_GAMEOVER;
            resultText = "イボジッチ敗北…";
          } else if (enemy.hp <= 0) {
            if (stage < MAX_STAGE) {
              // ステージクリア → 次ステージへ
              state = STATE_STAGE_CLEAR;
              stageClearText = getStageClearMessage(stage);
            } else {
              // 最終ステージ撃破 → 完全勝利
              state = STATE_GAMEOVER;
              resultText = "勝利！いぼ次元制圧！";
            }
          }''', '''  if (player.hp <= 0) {
            state = STATE_GAMEOVER;
            resultText = "イボジッチ敗北…";
            sfxDefeat();
          } else if (enemy.hp <= 0) {
            if (stage < MAX_STAGE) {
              // ステージクリア → 次ステージへ
              state = STATE_STAGE_CLEAR;
              stageClearText = getStageClearMessage(stage);
              sfxStageClear();
            } else {
              // 最終ステージ撃破 → 完全勝利
              state = STATE_GAMEOVER;
              resultText = "勝利！いぼ次元制圧！";
              sfxVictory();
            }
          }''')

          p.write_text(t, encoding='utf-8')
          PY
      - name: Commit patch and clean installer
        run: |
          rm .github/workflows/install-se.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add retro sound effects"
          git push
